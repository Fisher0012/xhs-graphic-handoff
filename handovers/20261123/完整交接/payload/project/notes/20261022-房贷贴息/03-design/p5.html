<div class="hdr"><span class="dot"></span><span class="brand">阿信学财经</span><span class="div"></span><span class="cat">政策解读</span></div>
<div class="h1"><span class="red">4个</span>最容易误会的点</div>
<div class="rows">
<div class="row r1"><span class="num">01</span><div><h3>不是降息</h3><p>合同利率不变，5年期满后<br>按原合同利率计息</p></div></div>
<div class="row r2"><span class="num">02</span><div><h3>不追溯</h3><p>10月1日前已放款的不享受；<br>已受理未放款的可问经办行</p></div></div>
<div class="row r3"><span class="num">03</span><div><h3>组合贷</h3><p>只贴商贷部分，公积金部分不贴</p></div></div>
<div class="row rn"><span class="num">04</span><div><h3>逾期就停</h3><p>逾期期间不贴，还清欠款后才恢复</p></div></div>
</div>
<div class="src">依据：财政部等三部门答记者问（2026.9.29）；<br>多家经办银行官方问答（2026.10）</div>
