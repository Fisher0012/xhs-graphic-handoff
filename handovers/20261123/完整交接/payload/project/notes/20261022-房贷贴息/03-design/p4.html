<div class="hdr"><span class="dot"></span><span class="brand">阿信学财经</span><span class="div"></span><span class="cat">政策解读</span></div>
<div class="h1">算笔账：<span class="red">能少付多少利息</span></div>
<div class="fx">每月贴息 ≈ 当月贷款余额 × <span>1%</span> ÷ 12</div>
<table>
<tr><th>贷款额</th><th>首月约少付</th><th>5年累计约少付</th></tr>
<tr><td>50万</td><td>417元</td><td class="red">2.4万</td></tr>
<tr><td>80万</td><td>667元</td><td class="red">3.8万</td></tr>
<tr class="hl"><td>100万</td><td>833元</td><td class="red">4.7万</td></tr>
</table>
<div class="note">余额越还越少，每月贴息也会逐月变少。<br>官方口径：100万长期贷款，<b>最多累计少付近5万元</b>。</div>
<div class="as">举例假设：30年等额本息、合同利率3.05%、不提前还款不逾期。估算仅供参考，以银行实际还款计划为准。</div>
